name: Wudland
options:
  bundleIdPrefix: com.joerobinson
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Wudland:
    type: application
    platform: iOS
    sources:
      - path: Wudland
        excludes: ["Web/**"]
      - path: Wudland/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joerobinson.wudland
        INFOPLIST_FILE: Wudland/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  WudlandTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Unit]
    dependencies: [{target: Wudland}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.joerobinson.wudland.tests
  WudlandUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies: [{target: Wudland}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.joerobinson.wudland.uitests
schemes:
  Wudland:
    build:
      targets:
        Wudland: all
    test:
      targets: [WudlandUITests, WudlandTests]
